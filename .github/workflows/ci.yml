name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall src tests mock_merchants
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest --cov=travel_agent --cov-report=term-missing
      - run: bandit -q -r src
      - run: pip-audit
